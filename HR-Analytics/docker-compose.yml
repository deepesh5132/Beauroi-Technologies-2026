version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hr_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hr_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/insert.sql:/docker-entrypoint-initdb.d/02_insert.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/hr_analytics
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=hr_analytics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgdata:
